name: CI

on:
  push:
    branches: [dev, prod, main]
  pull_request:
    branches: [dev, prod, main]
  workflow_dispatch:
    inputs:
      linux_namespaces:
        description: Run privileged namespace checks on this disposable hosted runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Install the TCP workload tool
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends iperf3
      - run: sh scripts/check.sh
      - run: shellcheck scripts/check.sh
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/branch_policy.py
  linux-namespaces:
    name: linux-namespaces
    if: github.event_name == 'workflow_dispatch' && inputs.linux_namespaces
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - name: Install isolated testbed tools
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends iperf3 iproute2 ethtool iputils-ping tcpdump
      - name: Exercise all four namespace profiles
        run: sudo env NETWORKS_RUN_PRIVILEGED=1 NETWORKS_EVIDENCE_DIR=.local/evidence/policy-checks .venv/bin/python -m unittest discover -s tests/linux -v
      - name: Run the fixed randomized pilot
        run: sudo .venv/bin/python scripts/campaign.py --config configs/pilot.json --output .local/campaign --authorized-isolated-host
      - name: Export all completed observations and attempt accounting
        if: always()
        run: |
          if sudo test -f .local/campaign/plan.json; then
            sudo .venv/bin/python scripts/export_pilot.py .local/campaign --output .local/evidence/pilot
          fi
          if sudo test -d .local/evidence; then
            sudo chmod -R a+rX .local/evidence
          fi
      - name: Retain the synthetic reference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: namespace-pilot-evidence
          path: .local/evidence
          if-no-files-found: warn
          retention-days: 30
