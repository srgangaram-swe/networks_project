name: CI

on:
  push:
    branches: [dev, prod, main]
  pull_request:
    branches: [dev, prod, main]
  workflow_dispatch:
    inputs:
      linux_namespaces:
        description: Run privileged namespace checks on this disposable hosted runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Install the TCP workload tool
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends iperf3
      - run: sh scripts/check.sh
      - run: shellcheck scripts/check.sh
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/branch_policy.py
  linux-namespaces:
    name: linux-namespaces
    if: github.event_name == 'workflow_dispatch' && inputs.linux_namespaces
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - name: Install isolated testbed tools
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends iperf3 iproute2 ethtool iputils-ping
      - name: Exercise all four namespace profiles
        run: sudo env NETWORKS_RUN_PRIVILEGED=1 .venv/bin/python -m unittest discover -s tests/linux -v
