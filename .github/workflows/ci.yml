name: CI

on:
  push:
    branches: [dev, prod, main]
  pull_request:
    branches: [dev, prod, main]
  workflow_dispatch:
    inputs:
      linux_namespaces:
        description: Run privileged namespace checks on this disposable hosted runner
        type: boolean
        default: false
      nucbox_setup:
        description: Run only the unloaded namespace setup check on a disposable Linux runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Install the TCP workload tool
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends iperf3
      - run: sh scripts/check.sh
      - run: shellcheck scripts/check.sh scripts/setup_nucbox.sh scripts/check_analysis.sh scripts/setup_environment.sh
  analysis:
    name: analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: sh scripts/setup_environment.sh
      - run: sh scripts/check_analysis.sh
      - name: Rebuild the published analysis through Compose
        run: |
          mkdir -p .local/container-output
          export LOCAL_UID="$(id -u)" LOCAL_GID="$(id -g)"
          export INPUT_DIR="$PWD/data/reference/namespace-pilot-2026-11-11/export"
          export OUTPUT_DIR="$PWD/.local/container-output"
          docker compose config --quiet
          docker compose run --build --rm analysis
          .venv/bin/python scripts/check_container_result.py .local/container-output/analysis
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/branch_policy.py
  cpp-prototype:
    name: cpp-prototype
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install C++ prototype tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake g++ libboost-dev clang-format
      - run: cmake -S experiments/cpp_network_testing -B build/cpp-network-probe -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/cpp-network-probe --parallel 2
      - run: ctest --test-dir build/cpp-network-probe --output-on-failure
      - run: clang-format --dry-run --Werror experiments/cpp_network_testing/server_host.cpp experiments/cpp_network_testing/server_client.cpp
      - run: shellcheck experiments/cpp_network_testing/timing.sh scripts/setup_environment.sh
  linux-namespaces:
    name: linux-namespaces
    if: github.event_name == 'workflow_dispatch' && inputs.linux_namespaces
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - name: Install and check the NucBox software path
        run: sh scripts/setup_nucbox.sh --install
      - name: Exercise all four namespace profiles
        run: sudo env NETWORKS_RUN_PRIVILEGED=1 NETWORKS_EVIDENCE_DIR=.local/evidence/policy-checks .venv/bin/python -m unittest discover -s tests/linux -v
      - name: Run the NucBox experiment through analysis and t-SNE
        run: sudo .venv/bin/python scripts/nucbox_experiment.py run --output .local/experiment --authorized-isolated-host
      - name: Export all completed observations and attempt accounting
        if: always()
        run: |
          if sudo test -f .local/experiment/campaign/plan.json && ! sudo test -d .local/experiment/export; then
            sudo .venv/bin/python scripts/export_pilot.py .local/experiment/campaign --output .local/experiment/export
          fi
          if sudo test -d .local/evidence; then
            sudo chmod -R a+rX .local/evidence
          fi
          if sudo test -d .local/experiment; then
            sudo chmod -R a+rX .local/experiment
          fi
      - name: Retain the synthetic reference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: namespace-pilot-evidence
          path: |
            .local/evidence
            .local/experiment/export
            .local/experiment/analysis
            .local/experiment/status.json
            .local/experiment/hardware.json
            .local/experiment/campaign/plan.json
            .local/experiment/campaign/progress.json
          if-no-files-found: warn
          retention-days: 30
  nucbox-setup:
    name: nucbox-setup
    if: github.event_name == 'workflow_dispatch' && inputs.nucbox_setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Install isolated setup tools
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends iproute2 iperf3 ethtool iputils-ping tcpdump kmod
      - name: Check the candidate and collect local inspection evidence
        run: |
          mkdir -p .local
          .venv/bin/python scripts/verify_testbed_contract.py
          .venv/bin/python scripts/inspect_hardware.py > .local/hardware-inventory.json
      - name: Exercise unloaded setup and cleanup for all four policies
        run: sudo .venv/bin/python scripts/nucbox_smoke.py run --output .local/nucbox-smoke --authorized-isolated-host
      - name: Make retained setup evidence readable
        if: always()
        run: |
          if sudo test -d .local/nucbox-smoke; then
            sudo chmod -R a+rX .local/nucbox-smoke
          fi
      - name: Retain setup evidence separately from pilot measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unloaded-namespace-setup-evidence
          path: |
            .local/hardware-inventory.json
            .local/nucbox-smoke
          if-no-files-found: warn
          retention-days: 30
